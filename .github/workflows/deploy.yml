# Runs the tests on every pull request and push. After a push to main (e.g. merging a pull
# request) passes the tests, it updates the server through scripts/deploy.sh.
#
# Repository secrets needed for the update step (Settings > Secrets and variables > Actions):
#   DEPLOY_HOST         server IP, e.g. 167.233.67.253
#   DEPLOY_SSH_KEY      private deploy key, as printed by `cat ~/.ssh/github_deploy` or as one line from
#                       `base64 -w0 ~/.ssh/github_deploy` (its public half only runs scripts/deploy.sh)
#   DEPLOY_KNOWN_HOSTS  the server's host key fingerprint, e.g. SHA256:abc... from
#                       `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` (or a full known_hosts line),
#                       so GitHub only talks to your server
name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        env:
          LOG_LEVEL: WARNING
        run: python -m unittest discover -s tests -t .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ]; then
            echo "Deploy secrets are not set yet; skipping the server update."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Secrets pasted from a Windows terminal can carry hidden \r characters; strip them.
          host="$(printf '%s' "$DEPLOY_HOST" | tr -d '[:space:]')"
          # Rebuild the private key from its base64 body so copy damage (trailing spaces, line breaks
          # turned into spaces, missing final newline) doesn't matter; also accepts a base64 -w0 copy.
          raw="$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d '\r')"
          if ! printf '%s' "$raw" | grep -q 'BEGIN OPENSSH PRIVATE KEY'; then
            raw="$(printf '%s' "$raw" | tr -d '[:space:]' | base64 -d 2>/dev/null || true)"
          fi
          body="$(printf '%s' "$raw" | sed -e 's/-----BEGIN OPENSSH PRIVATE KEY-----//' \
                                           -e 's/-----END OPENSSH PRIVATE KEY-----//' | tr -d '[:space:]')"
          { echo "-----BEGIN OPENSSH PRIVATE KEY-----"; printf '%s\n' "$body" | fold -w 70; \
            echo "-----END OPENSSH PRIVATE KEY-----"; } > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a complete private key. On the server run: base64 -w0 ~/.ssh/github_deploy"
            echo "and paste that single line as the DEPLOY_SSH_KEY secret."
            exit 1
          fi
          echo "Deploy key loaded: $(ssh-keygen -lf ~/.ssh/deploy_key | awk '{print $2}')"
          expected="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r')"

          ssh-keyscan -t ed25519 "$host" 2>/dev/null > ~/.ssh/scanned || true
          presented="$(ssh-keygen -lf ~/.ssh/scanned 2>/dev/null | awk '{print $2}')"
          echo "Server presents host key fingerprint: ${presented:-<none>}"

          if printf '%s' "$expected" | grep -q 'SHA256:'; then
            # Fingerprint mode: trust the scanned key only if it matches the saved fingerprint exactly.
            wanted="$(printf '%s' "$expected" | grep -o 'SHA256:[A-Za-z0-9+/=]*' | head -n 1)"
            echo "GitHub expects host key fingerprint: $wanted"
            if [ -z "$presented" ] || [ "$presented" != "$wanted" ]; then
              echo "Host key fingerprint does not match; refusing to connect."
              exit 1
            fi
            cp ~/.ssh/scanned ~/.ssh/known_hosts
          else
            # Full known_hosts line(s) mode.
            printf '%s\n' "$expected" | grep -v '^#' > ~/.ssh/known_hosts
            echo "GitHub expects host key fingerprint(s): $(ssh-keygen -lf ~/.ssh/known_hosts 2>&1 | awk '{print $2}' | tr '\n' ' ')"
          fi
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "root@$host" deploy
