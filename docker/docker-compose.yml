services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    image: docker-tenant_worker:latest
    container_name: agentic_sme_gateway
    restart: unless-stopped
    command: uvicorn src.gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER:-+14155238886}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - PLATFORM_ALERT_WHATSAPP=${PLATFORM_ALERT_WHATSAPP:-}
      - TENANTS_CONFIG_PATH=/app/config/tenants.yaml
      - TENANTS_DATA_DIR=/app/data/tenants
    volumes:
      - ..:/app
      - tenant_data:/app/data/tenants

volumes:
  tenant_data: