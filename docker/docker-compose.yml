version: '3.8'

networks:
  sme_mesh_network:
    driver: bridge

volumes:
  tenant_storage:
    driver: local

services:
  # ---------------------------------------------------------------------------
  # Central Inbound WhatsApp Webhook & LLM Token Proxy Gateway
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: agentic_gateway
    command: ["uvicorn", "src.gateway.whatsapp:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../config:/app/config:ro
    networks:
      - sme_mesh_network
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Generic Multi-Tenant OpenHuman Worker Pool (Horizontally Scalable)
  # ---------------------------------------------------------------------------
  tenant_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    command: ["python3", "-m", "src.core.engine"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATA_DIR=/app/data/tenants
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ../data/tenants:/app/data/tenants:rw
      - ../config:/app/config:ro
    networks:
      - sme_mesh_network
    depends_on:
      - gateway
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M