# Start with (from the repository root):
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --build
# Every "${VAR:?...}" below is required: the stack refuses to start until it is set in .env.

services:
  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    image: docker-tenant_worker:latest
    container_name: agentic_sme_gateway
    restart: unless-stopped
    # Single worker: dedup cache, rate limiter and tenant directory live in process memory.
    # Proxy headers are trusted from any address because only Caddy can reach this port.
    command: >
      uvicorn src.gateway.main:app --host 0.0.0.0 --port 8000
      --proxy-headers --forwarded-allow-ips=* --workers 1
    # Reachable only from other containers (Caddy); never published on the host.
    expose:
      - "8000"
    environment:
      - PYTHONPATH=/app
      # Meta WhatsApp Cloud API
      - WHATSAPP_TOKEN=${WHATSAPP_TOKEN:?set WHATSAPP_TOKEN in .env}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:?set WHATSAPP_PHONE_NUMBER_ID in .env}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET:?set WHATSAPP_APP_SECRET in .env}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:?set WHATSAPP_VERIFY_TOKEN in .env}
      - WHATSAPP_GRAPH_API_VERSION=${WHATSAPP_GRAPH_API_VERSION:-v23.0}
      # AI model; the app refuses to start if the key for the chosen model is missing.
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ALERT_EMAIL=${ALERT_EMAIL:?set ALERT_EMAIL in .env}
      - SMTP_USER=${SMTP_USER:?set SMTP_USER in .env}
      - SMTP_PASSWORD=${SMTP_PASSWORD:?set SMTP_PASSWORD in .env}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - ALERT_FROM_EMAIL=${ALERT_FROM_EMAIL:-}
      # Optional: billing is not used during the free pilot, and the Stripe webhook
      # rejects every request while STRIPE_WEBHOOK_SECRET is empty (fail-closed).
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Optional: higher quota for Google's free website check (works without a key at low volume).
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY:-}
      # Google Calendar / Search Console use the service account key at config/google-service-account.json
      # Optional second alert channel (WhatsApp) in addition to email.
      - PLATFORM_ALERT_WHATSAPP=${PLATFORM_ALERT_WHATSAPP:-}
      # Business list file inside config/. Use tenants.local.yaml for real numbers (kept out of git).
      - TENANTS_CONFIG_PATH=/app/config/${TENANTS_FILE:-tenants.yaml}
      - TENANTS_DATA_DIR=/app/data/tenants
    volumes:
      - ../config:/app/config
      - tenant_data:/app/data/tenants
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2
    container_name: agentic_sme_caddy
    restart: unless-stopped
    depends_on:
      - gateway
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env (e.g. assistant.example.com)}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tenant_data:
  caddy_data:
  caddy_config:
